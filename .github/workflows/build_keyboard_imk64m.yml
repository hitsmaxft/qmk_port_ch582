name: Build imk64m firmware
run-name: Build imk64m firmware

on:
  push:
    branches: ["mybuild2"]
  # pull_request:
  #   branches: ["via"]
  # # Allows you to run this workflow manually from the Actions tab or through HTTP API
  workflow_dispatch:
    inputs:
      keyboard:
        description: "Keyboard name"
        required: true
        type: string
        default: "imk64m"
      keymap:
        description: "Specified keymap"
        default: "macvim"
        required: true
        type: string

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set name output
        id: name
        run: |
          USER_KB=${{ github.event.keyboard }}
          USER_KM=${{ github.event.keymap }}
          echo "::set-output name=kb::${USER_KB:-"imk64m"}"
          echo "::set-output name=km::${USER_KM:-"macvim"}"

      - name: Fetch all
        run: git fetch

      - name: Prepare Submodules
        run: git -c submodule."qmk_porting/keyboards_private".update=none submodule update --recursive --init

      - name: Prepare Python requirements
        run: pip3 install -r ./mcuboot/scripts/requirements.txt

      - name: fix file mod
        run: chmod +x -R ./utils

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake --no-warn-unused-cli -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE -DCMAKE_BUILD_TYPE:STRING=${{env.BUILD_TYPE}} -Dkeyboard:STRING=${{steps.name.outputs.kb}} -Dkeymap:STRING=${{steps.name.outputs.km}} -S${{github.workspace}} -B${{github.workspace}}/build

      - name: Build
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target all --

      - name: Get git version
        run: echo "git_ver=$(git describe --always --dirty)" >> $GITHUB_ENV

      - name: UF2 Firmware (${{steps.name.outputs.kb}})
        uses: actions/upload-artifact@v4
        with:
          name: ${{steps.name.outputs.kb}}.uf2
          path: ${{steps.name.outputs.kb}}_upgrade_${{ env.git_ver }}.uf2

      - name: Hex Firmware (${{steps.name.outputs.kb}})
        uses: actions/upload-artifact@v4
        with:
          name: ${{steps.name.outputs.kb}}.hex
          path: ${{steps.name.outputs.kb}}_factory_${{ env.git_ver }}.hex

      # - name: Test
      #   working-directory: ${{github.workspace}}/build
      #   # Execute tests defined by the CMake configuration.
      #   # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      #   run: ctest -C ${{env.BUILD_TYPE}}
